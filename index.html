<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wheelie Timer">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>Wheelie Timer</title>
</head>

<body>
  <main class="container">

    <h1>WHEELIE TIMER</h1>

    <div id="timer" class="timer">0.00</div>
    <div class="seconds">SEKUNDER</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">BÄSTA</div>
        <div id="best" class="stat-value">0.00</div>
      </div>

      <div class="divider"></div>

      <div class="stat">
        <div class="stat-label">SENASTE</div>
        <div id="last" class="stat-value">0.00</div>
      </div>
    </div>

    <div id="angle" class="angle">0.0°</div>

    <button id="calibrateButton">
      KALIBRERA
    </button>

    <div id="status" class="status">
      KALIBRERA
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
