<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wheelie Timer">

  <title>Wheelie Timer</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <h1>WHEELIE TIMER</h1>

    <div id="timer" class="timer">0.00</div>
    <div class="label">SEKUNDER</div>

    <div id="speed" class="speed">0 km/h</div>
    <div class="label">SPEED</div>

    <section class="info-row">

      <div class="info">
        <div id="angle" class="value">0.0°</div>
        <div class="label">VINKEL</div>
      </div>

      <div class="info">
        <div id="maxSpeed" class="value">0 km/h</div>
        <div class="label">HASTIGAST</div>
      </div>

    </section>

    <div class="divider"></div>

    <section class="stats">

      <div class="stat">
        <div id="best" class="value">0.00</div>
        <div class="label">BÄSTA</div>
      </div>

      <div class="stat">
        <div id="last" class="value">0.00</div>
        <div class="label">SENASTE</div>
      </div>

    </section>

    <button id="calibrateButton">KALIBRERA</button>

    <button id="deleteButton" class="delete-button">
      RADERA SPARNINGAR
    </button>

    <div id="deleteMenu" class="delete-menu hidden">

      <div class="delete-title">
        RADERA SPARNINGAR
      </div>

      <div class="delete-question">
        Vad vill du radera?
      </div>

      <button id="deleteWheelie">
        WHEELIE
      </button>

      <button id="deleteSpeed">
        HASTIGHET
      </button>

      <button id="cancelDelete" class="cancel">
        AVBRYT
      </button>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
